server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ——— 压缩 ———
    # 产物里 JS 约 107KB，gzip 后 42KB —— 在国内网络下这一项很值
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # ——— 安全响应头 ———
    # 注意：下面所有 location 都只用 expires 控制缓存，没有用 add_header。
    # 因为 nginx 的 add_header 不跨层级继承 —— 任何 location 里一旦自己写了
    # add_header，server 级这几行就会被整个丢弃，很容易踩坑。
    # expires 是独立指令，不参与 add_header 的继承规则。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ——— 静态资源 ———
    # 产物文件名带内容 hash（index-DG7FXVP9.js），内容变了文件名就变，
    # 所以可以放心缓存一年。文件不存在时老实 404，不要回退到 index.html，
    # 否则浏览器会把一段 HTML 当 JS/CSS 解析，报错信息会非常难查。
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # favicon 没有内容 hash，换了图标文件名不变，缓存短一点
    # （精确匹配优先级高于上面的正则）
    location = /favicon.svg {
        expires 1d;
    }

    # ——— 入口 ———
    # 入口 HTML 不缓存，否则发新版本后用户手里还是旧的 HTML，
    # 而旧 HTML 引用的旧 hash 资源可能已经被冲掉了。
    #
    # 这里用正则而不是 location = /index.html：
    # 请求 / 时走的是 try_files → index 指令 → nginx 内部重定向到 /index.html，
    # 内部重定向会重新跑一遍 location 匹配，正则同样能命中；
    # 而且顺带覆盖了直接访问 /index.html 以及以后可能新增的其它 html。
    location ~* \.html$ {
        expires -1;
    }

    # 其余路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
